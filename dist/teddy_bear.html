<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport"><title>Teddy Bear</title><link href="style.css" rel="stylesheet"><script src="js/access-control.js"></script><script src="translations/translationManager.js"></script><script src="translations/languageSelector.js"></script><script src="js/access-guard.js" defer="defer"></script><style>body{font-family:sans-serif!important;font-size:16px!important;padding:20px;line-height:1.6}.content{font-family:sans-serif!important;font-size:16px!important;max-width:720px;margin:auto}#contentContainer p,.content div,.content p,.content span{font-family:sans-serif!important;font-size:16px!important;line-height:1.6!important;color:#333!important;white-space:pre-wrap}h1{font-size:24px!important;text-align:center}.portrait{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px}.back-button{position:fixed;top:50%;right:10px;transform:translateY(-50%);z-index:1000;padding:10px 14px;background-color:#c8102e;color:#fff;font-size:16px;border:none;border-radius:8px 0 0 8px;cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.2)}</style></head><body><header class="main-header"><div class="header-content"><img src="images/icone titre0.png" alt="Icone 0" class="header-img left"><h1 id="mainTitle">CityLoop Quest Mons - La Chevauchée de Saint Georges</h1><img src="images/icone titre1.png" alt="Icone 1" class="header-img right"></div></header><div class="content"><h1 id="pageTitle">TeddyBear<br>Pop francophone et énergie montoise</h1><br><br><img src="images/teddy_bear.jpg" alt="TeddyBear" class="portrait"><br><br><h1 id="source"></h1><div id="contentContainer"></div></div><button class="back-button" id="back-button">BACK</button><script>let translations = {};

async function loadTranslations() {
    try {
        const response = await fetch('translations/translations_teddy_bear.json?v=' + Date.now());
        translations = await response.json();
        applyTranslations();
    } catch (error) {
        console.error('Erreur lors du chargement des traductions:', error);
    }
}

function initLanguageSelector() {
    const oldSelector = document.querySelector('.language-selector');
    if (oldSelector) oldSelector.remove();
    if (window.languageSelector) {
        window.languageSelector.createSelector();
        window.languageSelector.updateSelectorValue();
    }
}

function generateContent(lang) {
    const container = document.getElementById('contentContainer');
    const t = translations[lang] || translations.fr;
    if (!t || !t.content) return;
    container.innerHTML = `<p>${t.content.intro}</p>`;
}

function applyTranslations() {
    const rawLang = localStorage.getItem('selectedLanguage') || 'fr';
    const lang = rawLang === 'zh' ? 'cn' : rawLang === 'ja' ? 'jp' : rawLang;
    const t = translations[lang] || translations.fr;
    if (!t) return;
    if (window.languageSelector) window.languageSelector.updateSelectorValue();
    document.getElementById('mainTitle').textContent = t.mainTitle;
    document.getElementById('pageTitle').innerHTML = t.pageTitle.replace('\n', '<br>');
    document.getElementById('source').textContent = t.source || '';
    generateContent(lang);
    document.getElementById('back-button').textContent = t.backButton;
}

document.addEventListener('DOMContentLoaded', function() {
    if (window.checkPageAccess && !window.checkPageAccess('teddy_bear.html')) return;
    loadTranslations();
    initLanguageSelector();
});

document.addEventListener('languageChanged', function() {
    applyTranslations();
});

document.addEventListener("DOMContentLoaded", () => {
  const backButton = document.getElementById("back-button");
  if (backButton) {
    backButton.addEventListener("click", () => {
      window.location.href = "artistes_celebres.html";
    });
  }
});</script></body></html>
