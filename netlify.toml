# CityLoop Quest Mons - Office du Tourisme

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# POI communautaires : Netlify > Storage > Blobs
# Variables : SMTP_*, POI_STAFF_EMAIL, POI_APPROVE_SECRET, SITE_URL,
# NETLIFY_SITE_ID + NETLIFY_AUTH_TOKEN (ou NETLIFY_BLOB_READ_WRITE_TOKEN)

[functions]
  external_node_modules = ["@netlify/blobs"]

[functions."poi-propose"]
  timeout = 26

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/translations/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
